<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Turing Test</title>

    <link
        rel="stylesheet"
        href="/participant/style.css"
    >
</head>

<body>
    <main class="app">
        <header class="header">
            <h1>Turing Test</h1>
            <p id="status" class="status">
                Gotowy.
            </p>
        </header>


        <section class="recording-section">
            <button
                id="recordButton"
                class="button button-primary"
                type="button"
            >
                🔴 Nagraj
            </button>

            <button
                id="stopButton"
                class="button button-secondary"
                type="button"
                hidden
            >
                ⏹ Zatrzymaj
            </button>
        </section>



        <section
            id="review"
            class="review-section"
            hidden
        >
            <label for="transcript">
                Transkrypcja
            </label>

            <textarea
                id="transcript"
                rows="6"
                placeholder="Tutaj pojawi się transkrypcja..."
            ></textarea>

            <div class="actions">
                <button
                    id="rerecordButton"
                    class="button button-secondary"
                    type="button"
                >
                    🔄 Nagraj ponownie
                </button>

                <button
                    id="sendButton"
                    class="button button-primary"
                    type="button"
                >
                    ➡️ Wyślij
                </button>
            </div>
        </section>

        <section
            id="answer"
            class="answer-section"
            hidden
        >
            <h2>Odpowiedź</h2>

            <p id="answerText"></p>
        </section>
    </main>

    <script src="/participant/app.js"></script>
</body>
</html>
