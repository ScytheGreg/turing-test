<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turing Test — Uczestnik</title>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <div>
                <p class="eyebrow">TURING TEST</p>
                <h1 id="sessionTitle">Rozmowa</h1>
            </div>
            <div id="statusBadge" class="badge idle">Stan: Gotowy</div>
        </header>

        <main>
            <section class="conversation-panel" aria-label="Historia rozmowy">
                <div class="conversation-heading">
                    <h2>Rozmowa</h2>
                    <span class="conversation-hint">Twoje wiadomości są po prawej</span>
                </div>
                <div id="messages" class="messages" aria-live="polite">
                    <div id="emptyState" class="empty-state">
                        Rozpocznij rozmowę, nagrywając pierwszą wiadomość.
                    </div>
                </div>
            </section>

            <!-- Sekcja kontroli nagrywania -->
            <section class="controls-section">
                <button id="recordButton" class="btn btn-record">
                    🔴 Nagraj
                </button>
                <button id="stopButton" class="btn btn-stop" hidden>
                    ⏹ Zatrzymaj
                </button>
            </section>

            <!-- Sekcja podglądu i edycji transkrypcji -->
            <section id="reviewSection" class="review-section" hidden>
                <label for="transcriptInput">Rozpoznany tekst (możesz edytować):</label>
                <textarea id="transcriptInput" rows="4"></textarea>

                <div class="action-buttons">
                    <button id="reRecordButton" class="btn btn-secondary">
                        🔄 Nagraj ponownie
                    </button>
                    <button id="sendButton" class="btn btn-primary">
                        🚀 Wyślij
                    </button>
                </div>
            </section>

        </main>
    </div>

    <script src="app.js?v=3"></script>
</body>
</html>
