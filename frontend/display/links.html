<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testowe konfiguracje display</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, sans-serif;
        }

        body {
            max-width: 760px;
            margin: 0 auto;
            padding: 32px 20px;
            background: #0b0d10;
            color: #f5f5f5;
        }

        a {
            display: block;
            margin: 12px 0;
            padding: 16px 18px;
            border: 1px solid #3d4650;
            border-radius: 10px;
            color: #b9d9ff;
            text-decoration: none;
        }

        a:hover {
            background: #1c252e;
            border-color: #79b8ff;
        }

        code {
            color: #c9d1d9;
        }
    </style>
</head>
<body>
    <h1>Testowe konfiguracje display</h1>
    <p>Kliknij wariant, aby otworzyć ekran rozmowy.</p>

    <a href="./">Domyślnie: lewa Alice, prawa Bob</a>
    <a href="./?left=bob&right=alice">Zamiana stron: lewa Bob, prawa Alice</a>
    <a href="./?left=alice&leftName=Anna&right=bob&rightName=Micha%C5%82">
        Anna (Alice) po lewej, Michał (Bob) po prawej
    </a>
    <a href="./?left=bob&leftName=Piotr&right=alice&rightName=Zosia">
        Piotr (Bob) po lewej, Zosia (Alice) po prawej
    </a>
    <a href="./?left=alice&leftName=Basia&right=bob&rightName=Grzesiek">
        Basia (Alice) i Grzesiek (Bob)
    </a>
    <a href="./?left=bob&leftName=Mateusz&right=alice&rightName=Ola">
        Mateusz (Bob) i Ola (Alice)
    </a>
</body>
</html>
