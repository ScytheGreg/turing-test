<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turing Test — Uczestnik</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Test Turinga</h1>
            <div id="statusBadge" class="badge idle">Stan: Gotowy</div>
        </header>

        <main>
            <!-- Sekcja kontroli nagrywania -->
            <section class="controls-section">
                <button id="recordButton" class="btn btn-record">
                    🔴 Nagraj
                </button>
                <button id="stopButton" class="btn btn-stop" hidden>
                    ⏹ Zatrzymaj
                </button>
            </section>

            <!-- Sekcja podglądu i edycji transkrypcji -->
            <section id="reviewSection" class="review-section" hidden>
                <label for="transcriptInput">Rozpoznany tekst (możesz edytować):</label>
                <textarea id="transcriptInput" rows="4"></textarea>

                <div class="action-buttons">
                    <button id="reRecordButton" class="btn btn-secondary">
                        🔄 Nagraj ponownie
                    </button>
                    <button id="sendButton" class="btn btn-primary">
                        🚀 Wyślij
                    </button>
                </div>
            </section>

            <!-- Sekcja odpowiedzi AI -->
            <section id="responseSection" class="response-section" hidden>
                <h3>Odpowiedź:</h3>
                <div id="answerText" class="answer-box"></div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
