[project]
name = "turing-test"
version = "0.1.0"
description = "Small local Turing test application"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring external services",
]
