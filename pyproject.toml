[project]
name = "turing-test"
version = "0.1.0"
description = "Small local Turing test application"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.2",
    "av==18.1",
    "sounddevice==0.5.6",
    "scipy",
    "nvidia-cublas-cu12==12.9.2.10",
    "nvidia-cuda-nvrtc-cu12==12.9.86",
    "nvidia-cudnn-cu12==9.27.0.42",
    "httpx",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
    "piper-tts>=1.8.0",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
