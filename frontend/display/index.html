<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Turinga — Display</title>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

    <main class="display">
        <button id="enableAudio">🔊 Włącz dźwięk</button>
        <section class="panel" id="leftPanel">
            <header class="panel-header">
                <div class="panel-kicker">Sesja <span id="leftSession">ALICE</span></div>
                <h1 id="leftTitle">ALICE</h1>
                <div class="panel-caption">Rozmowa w toku</div>
            </header>
            <div id="leftMessages"></div>
        </section>

        <section class="panel" id="rightPanel">
            <header class="panel-header">
                <div class="panel-kicker">Sesja <span id="rightSession">BOB</span></div>
                <h1 id="rightTitle">BOB</h1>
                <div class="panel-caption">Rozmowa w toku</div>
            </header>
            <div id="rightMessages"></div>
        </section>
    </main>

    <script src="config.js?v=3"></script>
    <script src="app.js?v=3"></script>
</body>
</html>
