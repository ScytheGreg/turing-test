<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turing Test — Uczestnik</title>
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <div>
                <p class="eyebrow">TURING TEST</p>
                <h1 id="sessionTitle">Rozmowa</h1>
            </div>
            <div id="statusBadge" class="badge idle">Łączenie...</div>
        </header>

        <main>
            <section class="conversation-panel" aria-label="Historia rozmowy">
                <div class="conversation-heading">
                    <h2>Rozmowa</h2>
                    <span class="conversation-hint">Twoje wiadomości są po prawej</span>
                </div>
                <div id="messages" class="messages" aria-live="polite">
                    <div id="emptyState" class="empty-state">
                        Wpisz wiadomość, aby rozpocząć rozmowę.
                    </div>
                </div>
            </section>

            <form id="messageForm" class="message-form">
                <label for="messageInput">Wiadomość</label>
                <div class="composer">
                    <textarea
                        id="messageInput"
                        placeholder="Napisz wiadomość..."
                        rows="3"
                        disabled
                    ></textarea>
                    <button id="sendButton" class="btn btn-primary" type="submit" disabled>
                        <span>Wyślij</span>
                        <span class="btn-icon" aria-hidden="true">↗</span>
                    </button>
                </div>
                <p class="input-hint">Enter wysyła wiadomość · Shift + Enter dodaje nową linię</p>
            </form>

        </main>
    </div>

    <script src="app.js?v=7"></script>
</body>
</html>
